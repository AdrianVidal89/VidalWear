# VidalWear en el NAS Jupiter.
# Ligera a propósito: en reposo ronda los 40 MB. Lo único que gasta algo es
# Pillow al recibir una foto (un pico de 60-80 MB que baja solo).
services:
  web:
    build: .
    image: vidalwear:latest
    container_name: vidalwear
    restart: unless-stopped
    # adrian es 1000 y su grupo en QTS es `everyone` (100).
    user: "${USUARIO:-1000:100}"
    ports:
      - "${PUERTO:-8085}:8085"
    environment:
      - VIDALWEAR_DATOS=/datos
      - VIDALWEAR_PUERTO=8085
      - VIDALWEAR_HILOS=4
      - TZ=${TZ:-Europe/Madrid}
      - MALLOC_ARENA_MAX=2
    volumes:
      - ./datos:/datos
    mem_limit: 256m
    memswap_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8085/estado', timeout=10).status == 200 else 1)"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 20s
