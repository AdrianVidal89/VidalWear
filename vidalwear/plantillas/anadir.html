{% extends "base.html" %}
{% block titulo %}Añadir · {{ app }}{% endblock %}
{% block contenido %}
<div class="portada">
  <p class="antetitulo">Añadir</p>
  <h1 class="titular">¿Qué vas a subir?</h1>
</div>
<ul class="categorias">
  {% for c in categorias %}
  <li><a href="{{ url_for('web.subir', clave=c.clave) }}"><span>{{ c.nombre }}</span><i aria-hidden="true">→</i></a></li>
  {% endfor %}
</ul>
<p class="explica centrado"><a href="{{ url_for('web.bienvenida') }}">Repetir la guía paso a paso</a></p>
{% endblock %}
